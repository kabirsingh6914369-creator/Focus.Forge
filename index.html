function hexToRgb(hex) {
  const cleaned = hex.replace(/[^0-9a-fA-F]/g, '');
  if (cleaned.length === 3) {
    const r = parseInt(cleaned[0] + cleaned[0], 16);
    const g = parseInt(cleaned[1] + cleaned[1], 16);
    const b = parseInt(cleaned[2] + cleaned[2], 16);
    return {
      r,
      g,
      b
    };
  }
  if (cleaned.length === 6) {
    const r = parseInt(cleaned.slice(0, 2), 16);
    const g = parseInt(cleaned.slice(2, 4), 16);
    const b = parseInt(cleaned.slice(4, 6), 16);
    return {
      r,
      g,
      b
    };
  }
  return null;
}
function getRelativeLuminance(hex) {
  const rgb = hexToRgb(hex);
  if (!rgb) return 0;
  const [rs, gs, bs] = [rgb.r / 255, rgb.g / 255, rgb.b / 255].map(c => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
}
function getContrastRatio(hex1, hex2) {
  const l1 = getRelativeLuminance(hex1);
  const l2 = getRelativeLuminance(hex2);
  const lighter = Math.max(l1, l2);
  const darker = Math.min(l1, l2);
  return Number(((lighter + 0.05) / (darker + 0.05)).toFixed(2));
}
function evaluateContrast(bgHex, textHex) {
  const ratio = getContrastRatio(bgHex, textHex);
  const bgLum = getRelativeLuminance(bgHex);
  const suggestionHex = bgLum > 0.35 ? '#0F172A' : '#F8FAFC';
  if (ratio >= 7) {
    return {
      ratio,
      level: 'AAA',
      passesAA: true,
      suggestionHex
    };
  }
  if (ratio >= 4.5) {
    return {
      ratio,
      level: 'AA',
      passesAA: true,
      suggestionHex
    };
  }
  if (ratio >= 3.0) {
    return {
      ratio,
      level: 'AA-Large',
      passesAA: false,
      suggestionHex
    };
  }
  return {
    ratio,
    level: 'Low',
    passesAA: false,
    suggestionHex
  };
}
